<div class="fitness-home-page">
  <div class="content-box">
    <h1>Bienvenue sur notre application de fitness</h1>
    <p>Obtenez un recapitulatif de votre activité physique.</p>

    <div *ngIf="connectedUser">
      <button (click)="navigateToFitness()">Commencer</button>

      <div *ngIf="recapsHistory.length > 0" class="recap-section">
        <h2>Vos précédents récapitulatifs</h2>
        <div>
          <ul>
            <li *ngFor="let recap of recapsHistory">
              <h3>Recap N°{{ recap.id }} - {{recap.exercices.length }} exercices - {{recap.repas.length}} repas</h3>
              <button class="button-secondary" (click)="openDetails(recap)">
                Voir les détails
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div *ngIf="!connectedUser">
      <p>Veuillez vous connecter ou vous inscrire pour commencer.</p>
      <button routerLink="/login">Se connecter</button>
      <button routerLink="/register">S'inscrire</button>
    </div>
  </div>
</div>


<app-home-history [show]="showDialog" [recap]="selectedRecap" (cancel)="closeDetails()">
</app-home-history>
