<div class="page-container">
  <div class="form-wrapper">
    <div class="form-header">
      <h2>Ajouter un exercice</h2>
      <p>Indiquez les détails de votre exercice 🏋️‍♂️</p>
    </div>

    <form [formGroup]="exerciseForm" (ngSubmit)="addExercise()">
      <div class="form-group">
        <label for="exercise-name">Nom</label>
        <input type="text" id="exercise-name" placeholder="Ex: Squat" formControlName="exercisename" />
      </div>

      <div class="form-group">
        <label for="exercise-group">Groupe musculaire</label>
        <input type="text" id="exercise-group" placeholder="Ex: Jambes" formControlName="exercisegroup" />
      </div>

      <div class="form-group">
        <label for="exercise-type">Type</label>
        <input type="text" id="exercise-type" placeholder="Ex: Renforcement" formControlName="type" />
      </div>
      <p *ngIf="exerciseForm.invalid && (exerciseForm.touched || exerciseForm.dirty)" class="register_error">
        {{ getErrorLabel }}
      </p>
      <div class="button-group">
        <button type="submit" class="submit-btn" [disabled]="exerciseForm.invalid">Ajouter l'exercice</button>
        <button type="button" class="submit-btn next-btn" (click)="goToNextStep()">Suivant</button>
      </div>
    </form>
  </div>
</div>
