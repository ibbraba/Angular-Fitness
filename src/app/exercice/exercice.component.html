<div class="page-container">
  <div class="form-wrapper">
    <div class="form-header">
      <h2>Ajouter un exercice</h2>
      <p>Indiquez les détails de votre exercice 🏋️‍♂️</p>
    </div>

    <form [formGroup]="exerciceForm" (ngSubmit)="addExercice()">
      <div class="form-group">
        <label for="exercise-name">Nom</label>
        <input type="text" id="exercise-name" placeholder="Ex: Squat" formControlName="exercicename" />
      </div>

      <div class="form-group">
        <label for="exercise-group">Groupe musculaire</label>
        <input type="text" id="exercise-group" placeholder="Ex: Jambes" formControlName="exercicegroup" />
      </div>

      <div class="form-group">
        <label for="exercise-type">Type</label>
        <input type="text" id="exercise-type" placeholder="Ex: Renforcement" formControlName="type" />
      </div>
      <p *ngIf="exerciceForm.invalid && (exerciceForm.touched || exerciceForm.dirty)" class="register_error">
        {{ getErrorLabel }}
      </p>

      <button type="submit" class="submit-btn" [disabled]="exerciceForm.invalid">Ajouter l'exercice</button>
    </form>
  </div>
</div>
